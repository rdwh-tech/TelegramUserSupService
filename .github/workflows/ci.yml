name: CI

on:
  push:
    branches: [ "main", "dev", "web-redesign", "feature/**", "ci-integration-test" ]
  pull_request:
    branches: [ "main", "dev", "web-redesign", "feature/**" ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Frontend Web Panel (React Router / TypeScript)
  # ─────────────────────────────────────────
  test-and-build-web:
    name: 🖥️ Web Panel (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tuss-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/tuss-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
  test-backend:
    name: ⚙️ Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Show coverage
        run: go tool cover -func=coverage.out | tail -n 1

  test-backend-integration:
    name: 🗄️ Backend Integration (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.0.5-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/integration_tests?sslmode=disable
          TEST_AMQP_URL: amqp://ci:ci-password@127.0.0.1:5672/
        run: go test -count=1 -race -tags=integration ./...
