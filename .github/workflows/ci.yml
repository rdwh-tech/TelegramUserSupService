name: CI

on:
  push:
    branches: [ "main", "dev", "web-redesign", "feature/**" ]
  pull_request:
    branches: [ "main", "dev", "web-redesign", "feature/**" ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Frontend Web Panel (React Router / TypeScript)
  # ─────────────────────────────────────────
  test-and-build-web:
    name: 🖥️ Web Panel (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tuss-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/tuss-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
  test-backend:
    name: ⚙️ Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Show coverage
        run: go tool cover -func=coverage.out | tail -n 1
