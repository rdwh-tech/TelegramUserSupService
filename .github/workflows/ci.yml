name: CI

on:
  push:
    branches: [ "main", "dev", "web-redesign", "feature/**" ]
  pull_request:
    branches: [ "main", "dev", "web-redesign", "feature/**" ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Frontend Web Panel (React Router / TypeScript)
  # ─────────────────────────────────────────
  test-and-build-web:
    name: 🖥️ Web Panel (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tuss-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/tuss-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
