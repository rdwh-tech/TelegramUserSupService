name: ✨ Feature Request
description: Предложи новую функциональность
labels: ["feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - bot
        - backend
        - frontend
        - docs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание фичи
      placeholder: Что нужно реализовать?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Зачем это нужно?
      placeholder: Какую проблему решает?
    validations:
      required: true
  - type: input
    id: taiga
    attributes:
      label: Задача в Taiga
      placeholder: "#XXX"
