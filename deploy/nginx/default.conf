log_format safe '$remote_addr - $request_method $server_protocol $status $body_bytes_sent request_time=$request_time';

server {
    listen 8080 default_server;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    error_log /dev/null;
    proxy_connect_timeout 2s;
    merge_slashes on;

    location = /health {
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_pass http://api:8080/health;
    }

    location = /ready {
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_pass http://api:8080/ready;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_pass http://api:8080;
    }

    location = /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_pass http://api:8080/ws;
    }

    location / {
        return 404;
    }
}
